<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Architecture of the Python on Amazon EKS blueprint">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#101b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Roboto, system-ui, sans-serif; fill: #e6edf7; }
      .title { font-size: 40px; font-weight: 650; letter-spacing: -0.5px; }
      .sub { font-size: 19px; fill: #93a4c0; }
      .eyebrow { font-size: 13px; fill: #60a5fa; letter-spacing: 2.4px; font-weight: 600; }
      .node { font-size: 16px; font-weight: 600; }
      .meta { font-size: 13px; fill: #93a4c0; }
      .gate { font-size: 13px; fill: #cbd5e1; font-weight: 500; }
      .zone { font-size: 12px; fill: #7c8db0; letter-spacing: 1.2px; }
      .box { fill: #16203a; stroke: #263352; stroke-width: 1.5; }
      .boxlit { fill: #1a2947; stroke: #38507f; stroke-width: 1.5; }
      .wire { stroke: #3d5480; stroke-width: 2; fill: none; }
      .wiredash { stroke: #3d5480; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
      .chip { fill: #14243f; stroke: #2b3f66; stroke-width: 1.2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d5480"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>

  <text class="t eyebrow" x="64" y="72">UDAP PRODUCTION BLUEPRINT</text>
  <text class="t title" x="64" y="122">Python API on Amazon EKS</text>
  <text class="t sub" x="64" y="156">Managed Kubernetes, security-gated delivery, encrypted Postgres — live in your own AWS account.</text>

  <!-- Pipeline gates -->
  <text class="t zone" x="64" y="212">DELIVERY PIPELINE — EVERY GATE MUST PASS BEFORE AWS IS TOUCHED</text>
  <g>
    <rect class="chip" x="64" y="226" width="118" height="34" rx="8"/>
    <text class="t gate" x="123" y="248" text-anchor="middle">Ruff</text>
    <rect class="chip" x="190" y="226" width="104" height="34" rx="8"/>
    <text class="t gate" x="242" y="248" text-anchor="middle">pytest</text>
    <rect class="chip" x="302" y="226" width="132" height="34" rx="8"/>
    <text class="t gate" x="368" y="248" text-anchor="middle">Semgrep SAST</text>
    <rect class="chip" x="442" y="226" width="124" height="34" rx="8"/>
    <text class="t gate" x="504" y="248" text-anchor="middle">Gitleaks</text>
    <rect class="chip" x="574" y="226" width="128" height="34" rx="8"/>
    <text class="t gate" x="638" y="248" text-anchor="middle">Licences</text>
    <rect class="chip" x="710" y="226" width="150" height="34" rx="8"/>
    <text class="t gate" x="785" y="248" text-anchor="middle">CycloneDX SBOM</text>
    <rect class="chip" x="868" y="226" width="150" height="34" rx="8"/>
    <text class="t gate" x="943" y="248" text-anchor="middle">Checkov / tfsec</text>
    <rect class="chip" x="1026" y="226" width="110" height="34" rx="8"/>
    <text class="t gate" x="1081" y="248" text-anchor="middle">Trivy</text>
  </g>

  <!-- Runtime -->
  <text class="t zone" x="64" y="312">RUNTIME — YOUR AWS ACCOUNT</text>

  <rect class="box" x="64" y="330" width="150" height="86" rx="12"/>
  <text class="t node" x="139" y="368" text-anchor="middle">Clients</text>
  <text class="t meta" x="139" y="390" text-anchor="middle">HTTPS</text>

  <rect class="box" x="248" y="330" width="176" height="86" rx="12"/>
  <text class="t node" x="336" y="362" text-anchor="middle">Network Load</text>
  <text class="t node" x="336" y="382" text-anchor="middle">Balancer</text>
  <text class="t meta" x="336" y="402" text-anchor="middle">cross-zone</text>

  <!-- VPC -->
  <rect class="box" x="458" y="300" width="486" height="250" rx="14" fill="#111c33" stroke="#22314f"/>
  <text class="t zone" x="480" y="326">VPC · 2 AVAILABILITY ZONES</text>

  <rect class="boxlit" x="482" y="342" width="200" height="96" rx="11"/>
  <text class="t node" x="582" y="374" text-anchor="middle">EKS Python Pods</text>
  <text class="t meta" x="582" y="396" text-anchor="middle">HPA · rolling updates</text>
  <text class="t meta" x="582" y="416" text-anchor="middle">liveness + readiness</text>

  <rect class="boxlit" x="712" y="342" width="208" height="96" rx="11"/>
  <text class="t node" x="816" y="374" text-anchor="middle">Postgres (RDS)</text>
  <text class="t meta" x="816" y="396" text-anchor="middle">encrypted · private</text>
  <text class="t meta" x="816" y="416" text-anchor="middle">7-day backups</text>

  <rect class="box" x="482" y="462" width="200" height="66" rx="11"/>
  <text class="t node" x="582" y="490" text-anchor="middle">KMS</text>
  <text class="t meta" x="582" y="510" text-anchor="middle">Secret encryption</text>

  <rect class="box" x="712" y="462" width="208" height="66" rx="11"/>
  <text class="t node" x="816" y="490" text-anchor="middle">CloudWatch</text>
  <text class="t meta" x="816" y="510" text-anchor="middle">audit + flow logs</text>

  <rect class="box" x="982" y="330" width="154" height="86" rx="12"/>
  <text class="t node" x="1059" y="362" text-anchor="middle">ECR</text>
  <text class="t meta" x="1059" y="384" text-anchor="middle">scan on push</text>
  <text class="t meta" x="1059" y="404" text-anchor="middle">immutable history</text>

  <!-- Wires -->
  <path class="wire" d="M214 373 L244 373" marker-end="url(#arrow)"/>
  <path class="wire" d="M424 373 L478 373" marker-end="url(#arrow)"/>
  <path class="wire" d="M682 390 L708 390" marker-end="url(#arrow)"/>
  <path class="wiredash" d="M982 373 L940 373 M940 373 L940 300" marker-end="url(#arrow)"/>
  <path class="wiredash" d="M582 438 L582 458" marker-end="url(#arrow)"/>
  <path class="wiredash" d="M816 438 L816 458" marker-end="url(#arrow)"/>

  <text class="t meta" x="64" y="592">Terraform provisions it · GitHub Actions ships it · one destroy removes it</text>
  <text class="t meta" x="1136" y="592" text-anchor="end">python-eks · v1.0.0</text>
</svg>
