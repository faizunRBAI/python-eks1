# Ingress for faizun.hepttech.com
# cert-manager will automatically provision and renew the TLS certificate via
# the letsencrypt-prod ClusterIssuer using the HTTP-01 challenge.
#
# ssl-redirect is DISABLED here so:
#   1. cert-manager can complete the HTTP-01 ACME challenge on port 80.
#   2. The verify health check can reach /health over plain HTTP.
# Once the certificate is issued and CNAME is in place, you may add:
#   nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: %%NAMESPACE%%
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - faizun.hepttech.com
      secretName: faizun-hepttech-tls
  rules:
    - host: faizun.hepttech.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
