apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: '%%NAMESPACE%%'
  labels:
    app.kubernetes.io/name: api
  # Traffic now enters via ingress-nginx (NLB → ingress controller → ClusterIP).
  # The LoadBalancer type and its annotations have been removed — the ingress
  # controller owns the NLB.
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
