# ingress-nginx Helm values
# Installs a single ingress-nginx controller backed by an AWS NLB.
# The NLB replaces the per-Service LoadBalancer that previously fronted the app.

controller:
  replicaCount: 2

  service:
    type: LoadBalancer
    annotations:
      # Use an NLB (Network Load Balancer) — same class as before.
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    externalTrafficPolicy: Local

  # Allow cert-manager HTTP-01 challenges to reach the controller on port 80.
  # Do NOT enable SSL passthrough — TLS terminates at the ingress controller.
  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  # Pod Disruption Budget — keep at least one replica up during node drains.
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

rbac:
  create: true
