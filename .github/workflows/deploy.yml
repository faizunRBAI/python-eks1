        \ | gpg --dearmor \\\n  | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null\n\
        echo \"deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb\
        \ generic main\" \\\n  | sudo tee /etc/apt/sources.list.d/trivy.list\nsudo\
        \ apt-get update -qq\nsudo apt-get install -y --no-install-recommends trivy\n\
        trivy --version\n"
    - name: Resolve image reference
      run: 'ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

        echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"

        echo "IMAGE=${REGISTRY}/${{ secrets.PROJECT_NAME }}:${GITHUB_SHA::12}" >>
