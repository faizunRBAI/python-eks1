    - name: Resolve image reference
      run: 'ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

        echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"

        echo "IMAGE=${REGISTRY}/${{ secrets.PROJECT_NAME }}:${GITHUB_SHA::12}" >>
        "$GITHUB_ENV"

        '
    - name: Log in to Amazon ECR
      run: "aws ecr get-login-password --region \"$AWS_REGION\" \\\n  | docker login\
        \ --username AWS --password-stdin \"$REGISTRY\"\n"
    - name: Build image
      run: "docker build \\\n  --tag \"$IMAGE\" \\\n  --label \"org.opencontainers.image.revision=${GITHUB_SHA}\"\
        \ \\\n  --label \"org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}\"\
