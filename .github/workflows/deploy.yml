        terraform_wrapper: false
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - name: Install Helm
      run: 'curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        | bash

        helm version

        '
    - name: Read the database connection string
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=${AWS_REGION}\"\n\
        DB_URL=\"$(terraform output -raw database_url 2>/dev/null || true)\"\nif [\
        \ -n \"$DB_URL\" ]; then\n  echo \"::add-mask::${DB_URL}\"\nelse\n  echo \"\
        No database in this configuration \u2014 the service will run stateless.\"\
        \nfi\necho \"DB_URL=${DB_URL}\" >> \"$GITHUB_ENV\"\n"
      working-directory: infra
    - name: Configure cluster access
      run: "aws eks update-kubeconfig \\\n  --name \"${{ secrets.PROJECT_NAME }}-eks\"\
        \ \\\n  --region \"$AWS_REGION\"\n"
    - name: Install cert-manager
      run: "helm repo add jetstack https://charts.jetstack.io --force-update\nhelm\
        \ repo update\nhelm upgrade --install cert-manager jetstack/cert-manager \\\
        \n  --namespace cert-manager \\\n  --create-namespace \\\n  --version v1.16.2\
        \ \\\n  --values k8s/cert-manager-values.yaml \\\n  --wait \\\n  --timeout\
        \ 5m\n"
    - name: Install ingress-nginx
      run: "helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx\
        \ --force-update\nhelm repo update\nhelm upgrade --install ingress-nginx ingress-nginx/ingress-nginx\
        \ \\\n  --namespace ingress-nginx \\\n  --create-namespace \\\n  --version\
        \ 4.11.3 \\\n  --values k8s/ingress-nginx-values.yaml \\\n  --wait \\\n  --timeout\
        \ 5m\n"
    - name: Apply ClusterIssuer (Let's Encrypt)
      run: "# Wait until cert-manager webhook is ready before applying CRDs\nkubectl\
        \ rollout status deployment/cert-manager-webhook \\\n  --namespace cert-manager\
        \ --timeout=3m\nkubectl apply -f k8s/clusterissuer.yaml\n"
    - name: Install the metrics server
      run: "kubectl apply -f \\\n  https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml\n"
    - name: Bootstrap namespace, secret and service account
      run: "set -euo pipefail\nNAMESPACE=\"${{ secrets.PROJECT_NAME }}\"\nIMAGE_TAG=\"\
        ${GITHUB_SHA::12}\"\nACCOUNT_ID=\"$(aws sts get-caller-identity --query Account\
        \ --output text)\"\necho \"NAMESPACE=${NAMESPACE}\" >> \"$GITHUB_ENV\"\necho\
        \ \"IMAGE_TAG=${IMAGE_TAG}\" >> \"$GITHUB_ENV\"\necho \"IMAGE=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${NAMESPACE}:${IMAGE_TAG}\"\
        \ >> \"$GITHUB_ENV\"\n\nkubectl create namespace \"$NAMESPACE\" --dry-run=client\
        \ -o yaml | kubectl apply -f -\n\nif [ -n \"${DB_URL:-}\" ]; then\n  kubectl\
        \ create secret generic app-database \\\n    --namespace \"$NAMESPACE\" \\\
        \n    --from-literal=DATABASE_URL=\"${DB_URL}\" \\\n    --dry-run=client -o\
        \ yaml | kubectl apply -f -\nelse\n  kubectl delete secret app-database --namespace\
        \ \"$NAMESPACE\" --ignore-not-found\nfi\n\nsed -e \"s|%%NAMESPACE%%|${NAMESPACE}|g\"\
        \ k8s/serviceaccount.yaml | kubectl apply -f -\n"
    - name: Run database migrations
      run: "set -euo pipefail\nif [ -z \"${DB_URL:-}\" ]; then\n  echo \"No database\
        \ in this configuration \u2014 nothing to migrate.\"\n  exit 0\nfi\n\nkubectl\
        \ delete job db-migrate -n \"$NAMESPACE\" --ignore-not-found --wait=true\n\
        sed -e \"s|%%NAMESPACE%%|${NAMESPACE}|g\" \\\n    -e \"s|%%IMAGE%%|${IMAGE}|g\"\
        \ \\\n    k8s/db-migrate-job.yaml | kubectl apply -f -\n\nDEADLINE=$((SECONDS\
        \ + 300))\nOUTCOME=\"pending\"\nwhile [ \"$SECONDS\" -lt \"$DEADLINE\" ];\
        \ do\n  SUCCEEDED=\"$(kubectl get job db-migrate -n \"$NAMESPACE\" -o jsonpath='{.status.succeeded}'\
        \ 2>/dev/null || true)\"\n  FAILED=\"$(kubectl get job db-migrate -n \"$NAMESPACE\"\
        \ -o jsonpath='{.status.failed}' 2>/dev/null || true)\"\n  if [ \"${SUCCEEDED:-}\"\
        \ = \"1\" ]; then OUTCOME=\"succeeded\"; break; fi\n  if [ -n \"${FAILED:-}\"\
        \ ] && [ \"${FAILED}\" != \"0\" ]; then OUTCOME=\"failed\"; break; fi\n  sleep\
        \ 5\ndone\n\necho \"--- migration log ---\"\nkubectl logs job/db-migrate -n\
        \ \"$NAMESPACE\" --tail=200 || echo \"(no pod log available)\"\n\nif [ \"\
        $OUTCOME\" != \"succeeded\" ]; then\n  [ \"$OUTCOME\" = \"pending\" ] && OUTCOME=\"\
        did not finish within 300s\"\n  echo \"--- job and pod state ---\"\n  kubectl\
        \ describe job db-migrate -n \"$NAMESPACE\" || true\n  kubectl get pods -n\
        \ \"$NAMESPACE\" -l job-name=db-migrate -o wide || true\n  kubectl describe\
        \ pods -n \"$NAMESPACE\" -l job-name=db-migrate || true\n  echo \"::error::Database\
        \ migration ${OUTCOME}. The migration log and pod state are above; nothing\
        \ was deployed.\"\n  exit 1\nfi\necho \"Schema is up to date.\"\n"
    - name: Apply Kubernetes manifests
      run: "set -euo pipefail\nfor manifest in k8s/*.yaml; do\n  case \"$(basename\
        \ \"$manifest\")\" in\n    db-migrate-job.yaml) continue ;;\n    ingress-nginx-values.yaml)\
        \ continue ;;\n    cert-manager-values.yaml) continue ;;\n    clusterissuer.yaml)\
        \ continue ;;\n  esac\n  sed -e \"s|%%NAMESPACE%%|${NAMESPACE}|g\" \\\n  \
        \    -e \"s|%%IMAGE_TAG%%|${IMAGE_TAG}|g\" \\\n      -e \"s|%%IMAGE%%|${IMAGE}|g\"\
        \ \\\n      \"$manifest\" | kubectl apply -f -\ndone\n"
    - name: Wait for the rollout
      run: "set -uo pipefail\nNS=\"${{ secrets.PROJECT_NAME }}\"\nif kubectl rollout\
        \ status deployment/api --namespace \"$NS\" --timeout=10m; then\n  exit 0\n\
        fi\necho \"--- pods ---\"\nkubectl get pods -n \"$NS\" -l app.kubernetes.io/name=api\
        \ -o wide || true\necho \"--- why the pods are not ready ---\"\nkubectl describe\
        \ pods -n \"$NS\" -l app.kubernetes.io/name=api \\\n  | grep -A 12 -E \"Conditions:|Events:|State:|Last\
        \ State:\" || true\necho \"--- application log ---\"\nkubectl logs -n \"$NS\"\
        \ -l app.kubernetes.io/name=api --tail=100 --all-containers || true\necho\
        \ \"--- namespace events ---\"\nkubectl get events -n \"$NS\" --sort-by=.lastTimestamp\
        \ | tail -25 || true\necho \"::error::The Deployment never became ready.\"\
        \nexit 1\n"
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - name: Get ingress-nginx NLB hostname
      run: "set -euo pipefail\nNAMESPACE=\"${{ secrets.PROJECT_NAME }}\"\naws eks\
        \ update-kubeconfig --name \"${NAMESPACE}-eks\" --region \"$AWS_REGION\"\n\
        HOST=\"\"\nfor _ in $(seq 1 40); do\n  HOST=\"$(kubectl get svc ingress-nginx-controller\
        \ -n ingress-nginx \\\n    -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'\
        \ 2>/dev/null || true)\"\n  if [ -z \"$HOST\" ]; then\n    HOST=\"$(kubectl\
        \ get svc ingress-nginx-controller -n ingress-nginx \\\n      -o jsonpath='{.status.loadBalancer.ingress[0].ip}'\
        \ 2>/dev/null || true)\"\n  fi\n  if [ -n \"$HOST\" ]; then break; fi\n  sleep\
        \ 15\ndone\nif [ -z \"$HOST\" ]; then\n  echo \"The ingress-nginx NLB never\
        \ reported an address after 10 minutes.\"\n  kubectl describe svc ingress-nginx-controller\
        \ -n ingress-nginx || true\n  echo \"::error::No ingress-nginx NLB address.\"\
        \n  exit 1\nfi\necho \"INGRESS_HOST=${HOST}\" >> \"$GITHUB_ENV\"\necho \"\
        Ingress NLB: ${HOST}\"\necho \"\"\necho \"============================================================\"\
        \necho \"ACTION REQUIRED \u2014 add this CNAME in cPanel:\"\necho \"  Name:\
        \  faizun\"\necho \"  Type:  CNAME\"\necho \"  Value: ${HOST}\"\necho \"============================================================\"\
        \n"
    - name: Health check via NLB (pre-DNS)
      run: "set -euo pipefail\nfor i in $(seq 1 40); do\n  CODE=\"$(curl -s -o /dev/null\
        \ -w '%{http_code}' \\\n    --max-time 10 \\\n    --header \"Host: faizun.hepttech.com\"\
        \ \\\n    \"http://${INGRESS_HOST}/health\" 2>/dev/null || true)\"\n  if [\
        \ \"$CODE\" = \"200\" ]; then\n    echo \"Service is healthy via ingress (HTTP\
        \ ${CODE})\"\n    exit 0\n  fi\n  echo \"  attempt ${i}/40: HTTP ${CODE}\"\
        \n  sleep 15\ndone\necho \"::error::App never returned 200 through ingress-nginx.\"\
        \nexit 1\n"
  notify:
    runs-on: ubuntu-latest
    needs:
    - verify
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - name: Deployment summary
      run: "set -uo pipefail\nNS=\"${{ secrets.PROJECT_NAME }}\"\naws eks update-kubeconfig\
        \ --name \"${NS}-eks\" --region \"$AWS_REGION\" >/dev/null 2>&1 || true\n\
        HOST=\"$(kubectl get svc ingress-nginx-controller -n ingress-nginx \\\n  -o\
        \ jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)\"\
        \n[ -n \"$HOST\" ] || HOST=\"$(kubectl get svc ingress-nginx-controller -n\
        \ ingress-nginx \\\n  -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null\
        \ || true)\"\n{\n  echo \"### Deployment complete\"\n  echo \"\"\n  echo \"\
        **Custom domain:** https://faizun.hepttech.com (after CNAME propagates)\"\n\
        \  echo \"\"\n  echo \"**Required cPanel DNS action:**\"\n  echo \"| Field\
        \ | Value |\"\n  echo \"|---|---|\"\n  echo \"| Name | \\`faizun\\` |\"\n\
        \  echo \"| Type | \\`CNAME\\` |\"\n  echo \"| Value | \\`${HOST}\\` |\"\n\
        \  echo \"\"\n  echo \"| | |\"\n  echo \"|---|---|\"\n  echo \"| Cluster |\
        \ \\`${NS}-eks\\` |\"\n  echo \"| Namespace | \\`${NS}\\` |\"\n  echo \"|\
        \ Image tag | \\`${GITHUB_SHA::12}\\` |\"\n  echo \"| Ingress NLB | \\`${HOST}\\\
        ` |\"\n  echo \"| API docs | \\`https://faizun.hepttech.com/docs\\` |\"\n\
        \  echo \"\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n[ -n \"$HOST\" ] && echo \"Ingress\
        \ NLB: ${HOST}\"\nexit 0\n"
